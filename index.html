<style>

.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-primary{background:var(--btn);color:#fff}
.btn-outline{background:transparent;border-color:var(--btn);color:var(--btnText)}
.btn-danger{background:var(--bad);color:#fff}
.btn-white{background:#fff;color:#0B1F4B}

@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{width:7px;border-radius:6px;height:10px;background:var(--btn)}
.wave.on .bar{animation:wave 1s ease-in-out infinite}
.wave.on .bar:nth-child(3n){background:var(--purple)}
@keyframes wave{0%,100%{height:8px}50%{height:44px}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback} = React;

/* ---------- util ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

  copy:"M9 9h10v11H9zM5 15V4h10", down:"M12 4v12m-5-5 5 5 5-5M5 20h14",

  moon:"M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z", contrast:"M12 3a9 9 0 1 0 0 18V3z M12 3a9 9 0 0 1 0 18",
  save:"M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6", menu:"M4 6h16M4 12h16M4 18h16", x:"M6 6l12 12M18 6 6 18",

/* ---------- tentang ---------- */

/* ---------- transkripsi ---------- */
function Transcribe({text,setText,settings,setSettings,autoDemo}){
  const [interim,setInterim]=useState("");
  const [status,setStatus]=useState("idle"); // idle | listening | paused | demo | demoPaused
  const [notice,setNotice]=useState(null);   // {type,msg}
  const [history,setHistory]=useState(()=>store.get("bt_history",[]));
  const recRef=useRef(null), wantRef=useRef(false);
  const demo=useRef({tokens:[],i:0,timer:null});
  const boxRef=useRef(null);
  const speed=settings.speed;
  const dictRef=useRef(null), dlRef=useRef(null);
  const [hasDict,setHasDict]=useState(false);
  const supported=!!SR||hasDict;

  useEffect(()=>{store.set("bt_history",history);},[history]);
  useEffect(()=>{
    let off=[],dead=false; const c=window.claude;
    if(!c||!c.use) return;
    c.use("downloads").then(d=>{ if(!dead) dlRef.current=d; }).catch(()=>{});
    c.use("dictation").then(d=>{
      if(dead||!d) return; dictRef.current=d; setHasDict(true);
      off.push(d.onPartial(e=>setInterim(e.text||"")));
      off.push(d.onFinal(e=>{ const t=(e.text||"").trim(); if(t) append(t); setInterim(""); }));
      off.push(d.onState(e=>{ if(e.state!=="idle") return; setInterim("");
        if(wantRef.current){ wantRef.current=false; setStatus("idle");
          if(e.reason==="not_granted") flash("perm","Izin mikrofon belum diberikan. Buka menu Izin (Permissions) pada artifact ini, izinkan dikte, lalu klik Mulai Mendengarkan lagi.");
          else if(e.reason==="unavailable") flash("warn","Pengenalan suara tidak tersedia untuk akun/bahasa ini. Gunakan Mode Demo di bawah.");
          else if(e.reason==="rate_limited") flash("warn","Terlalu banyak sesi dikte. Coba lagi sebentar lagi.");
          else if(e.reason==="upstream_error") flash("warn","Mikrofon atau layanan suara bermasalah. Coba lagi atau gunakan Mode Demo.");
          else flash("info","Mendengarkan berhenti."); } }));
    }).catch(()=>{});
    return ()=>{ dead=true; off.forEach(f=>{try{f();}catch(e){}}); };
  },[]);
  useEffect(()=>{ if(boxRef.current) boxRef.current.scrollTop=boxRef.current.scrollHeight; },[text,interim]);

  const flash=(type,msg)=>setNotice({type,msg});
  const append=(s)=>setText(p=>(p&&!/[\s]$/.test(p)?p+" ":p)+s);

  /* mikrofon */
  const killRec=()=>{ wantRef.current=false; const dd=dictRef.current; if(dd&&dd.active()){ dd.stop().catch(()=>{}); } const r=recRef.current; recRef.current=null; if(r){ r.onend=null; r.onerror=null; r.onresult=null; try{r.abort();}catch(e){} } };
  const startMic=()=>{
    if(!supported){ flash("warn","Browser Anda belum mendukung pengenalan suara (Web Speech API). Gunakan Google Chrome atau Microsoft Edge, atau coba Mode Demo di bawah."); return; }
    stopDemoTimer(); killRec(); setNotice(null);
    if(dictRef.current){
      wantRef.current=true; setStatus("listening");
      dictRef.current.start({language:"id"}).catch(e=>{ wantRef.current=false; setStatus("idle"); setInterim("");
        const c=e&&e.code;
        if(c==="not_granted") flash("perm","Izin mikrofon belum diberikan. Buka menu Izin (Permissions) pada artifact ini dan izinkan dikte, lalu coba lagi.");
        else if(c==="dismissed") flash("info","Permintaan izin ditutup. Klik Mulai Mendengarkan untuk mencoba lagi.");
        else if(c!=="stopped") flash("warn","Tidak dapat memulai pengenalan suara ("+(c||"error")+"). Gunakan Mode Demo."); });
      return;
    }
    const rec=new SR(); rec.lang="id-ID"; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
    rec.onresult=(e)=>{ let fin="",tmp="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) fin+=r[0].transcript; else tmp+=r[0].transcript; }
      if(fin) append(fin.trim()); setInterim(tmp); };
    rec.onerror=(e)=>{
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){ killRec(); setStatus("idle"); setInterim(""); flash("perm","Izin mikrofon belum diberikan. Klik ikon gembok/mikrofon di bilah alamat browser, pilih “Izinkan”, lalu klik Mulai Mendengarkan lagi."); }
      else if(e.error==="audio-capture"){ killRec(); setStatus("idle"); flash("warn","Mikrofon tidak ditemukan. Periksa perangkat Anda atau gunakan Mode Demo."); }
      else if(e.error==="network"){ killRec(); setStatus("idle"); flash("warn","Layanan pengenalan suara memerlukan koneksi internet. Periksa jaringan Anda atau gunakan Mode Demo."); }
    };
    rec.onend=()=>{ if(wantRef.current && recRef.current===rec){ try{rec.start();}catch(e){} } else if(recRef.current===rec){ setInterim(""); } };
    recRef.current=rec; wantRef.current=true;
    try{ rec.start(); setStatus("listening"); flash("info","Meminta izin mikrofon… silakan pilih “Izinkan” bila diminta browser."); }
    catch(e){ flash("warn","Tidak dapat memulai mikrofon: "+e.message); setStatus("idle"); }
  };
  const pauseMic=()=>{ killRec(); setInterim(""); setStatus("paused"); flash("info","Dijeda. Klik Lanjutkan untuk melanjutkan."); };
  const stopMic=()=>{ killRec(); setInterim(""); setStatus("idle"); flash("info","Transkripsi dihentikan."); };

  /* demo */
  const stopDemoTimer=()=>{ clearInterval(demo.current.timer); demo.current.timer=null; };
  const delay=()=>[0,900,600,380,220,110][speed]||380;
  const runDemo=()=>{
    stopDemoTimer();
    demo.current.timer=setInterval(()=>{
      const d=demo.current;
      if(d.i>=d.tokens.length){ stopDemoTimer(); setStatus("idle"); flash("ok","Demo selesai. Anda dapat menyimpan, menyalin, atau mengunduh hasilnya."); return; }
      const tk=d.tokens[d.i++]; append(tk);
      if(/[.!?]$/.test(tk)) setText(p=>p+"\n");
    },delay());
  };
  const startDemo=()=>{
    killRec(); setInterim(""); setNotice(null);
    demo.current.tokens=DEMO.join(" ").split(" "); demo.current.i=0;
    setText(""); setStatus("demo"); runDemo();
  };
  const pauseDemo=()=>{ stopDemoTimer(); setStatus("demoPaused"); };
  const resumeDemo=()=>{ setStatus("demo"); runDemo(); };
  const resetDemo=()=>{ stopDemoTimer(); demo.current.i=0; setText(""); setStatus("idle"); flash("info","Demo direset."); };
  // ganti kecepatan saat demo berjalan
  useEffect(()=>{ if(status==="demo") runDemo(); },[speed]);
  useEffect(()=>{ if(autoDemo){ const t=setTimeout(startDemo,300); return()=>clearTimeout(t);} },[autoDemo]);
  useEffect(()=>()=>{ killRec(); stopDemoTimer(); },[]);

  /* aksi teks */
  const clearText=()=>{ if(!text&&!interim) return; setText(""); setInterim(""); if(status==="demoPaused"){ stopDemoTimer(); setStatus("idle"); demo.current.i=0; } flash("info","Teks dihapus."); };
  const copyText=async()=>{
    const t=text.trim(); if(!t){ flash("warn","Belum ada teks untuk disalin."); return; }
    try{ await navigator.clipboard.writeText(t); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand("copy");}catch(_){} ta.remove(); if(!ok){ flash("warn","Gagal menyalin. Pilih teks lalu salin secara manual."); return; } }
    flash("ok","Teks berhasil disalin ke clipboard.");
  };
  const downloadText=()=>{
    const t=text.trim(); if(!t){ flash("warn","Belum ada teks untuk diunduh."); return; }
    const d=new Date(), p=n=>String(n).padStart(2,"0");
    const name=`bicarateks-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.txt`;
    if(dlRef.current){ dlRef.current.save({filename:name,data:t+"\n"}).then(()=>flash("ok",`Berkas ${name} siap disimpan.`)).catch(e=>{ if(!e||e.code!=="dismissed") flash("warn","Gagal mengunduh berkas."); }); return; }
    const blob=new Blob([t+"\n"],{type:"text/plain;charset=utf-8"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    flash("ok",`Berkas ${name} diunduh.`);
  };
  const saveHistory=()=>{
    const t=text.trim(); if(!t){ flash("warn","Belum ada teks untuk disimpan."); return; }
    const title=t.length>44?t.slice(0,44)+"…":t;
    setHistory(h=>[{id:Date.now(),title,text:t,date:Date.now()},...h]); flash("ok","Transkripsi disimpan ke riwayat.");
  };
  const openItem=(it)=>{ killRec(); stopDemoTimer(); setInterim(""); setStatus("idle"); setText(it.text); flash("info","Riwayat dibuka."); window.scrollTo({top:0,behavior:"smooth"}); };
  const delItem=(id)=>setHistory(h=>h.filter(x=>x.id!==id));
  const delAll=()=>{ setHistory([]); flash("info","Seluruh riwayat dihapus."); };

  const set=(k,v)=>setSettings(s=>({...s,[k]:v}));
  const active=status==="listening"||status==="demo";
  const sLabel={idle:["Mikrofon tidak aktif","var(--mute)"],listening:["Mikrofon aktif – mendengarkan","var(--ok)"],paused:["Dijeda","var(--btnText)"],demo:["Mode demo berjalan","var(--ok)"],demoPaused:["Demo dijeda","var(--btnText)"]}[status];
  const nCls={info:"bg-soft t-main",ok:"t-ok bg-soft",warn:"t-bad bg-soft",perm:"t-bad bg-soft"};

  return (
    <section className="mx-auto grid max-w-7xl gap-6 px-4 py-8 sm:px-8 lg:grid-cols-[1fr_380px] fade">
      <div className="grid min-w-0 gap-6">
        <div className="card p-5 sm:p-7">
          <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
            <h1 className="text-3xl font-extrabold t-main">Transkripsi Suara</h1>
            <div role="status" aria-live="polite" className="flex items-center gap-2.5 rounded-full bg-soft bd px-4 py-2 font-bold" style={{color:sLabel[1]}} data-testid="mic-status">
              <span className={`h-3 w-3 rounded-full ${active?"pulse":""}`} style={{background:active?"var(--ok)":"var(--mute)"}}/>{sLabel[0]}
            </div>
          </div>
          {!supported && <div role="alert" className="mb-4 flex gap-3 rounded-2xl bg-soft bd p-4 t-bad"><Icon n="warn" className="mt-0.5 shrink-0"/><p className="font-semibold">Browser ini belum mendukung SpeechRecognition. Gunakan Google Chrome atau Microsoft Edge untuk mikrofon; Mode Demo tetap dapat digunakan.</p></div>}
          <div className="flex flex-wrap gap-3">
            <Btn icon="mic" onClick={startMic} disabled={status==="listening"||status==="demo"} data-testid="btn-start">Mulai Mendengarkan</Btn>
            <Btn v="outline" icon="pause" onClick={pauseMic} disabled={status!=="listening"} data-testid="btn-pause">Jeda</Btn>
            <Btn v="outline" icon="play" onClick={startMic} disabled={status!=="paused"} data-testid="btn-resume">Lanjutkan</Btn>
            <Btn v="danger" icon="stop" onClick={stopMic} disabled={status!=="listening"&&status!=="paused"} data-testid="btn-stop">Berhenti</Btn>
          </div>
          <div className={`wave ${active?"on":""} my-5 flex h-14 items-center justify-center gap-1.5 rounded-2xl bg-soft`} aria-hidden="true" data-testid="wave">
            {Array.from({length:30}).map((_,i)=><span key={i} className="bar" style={{animationDelay:`${(i%10)*.09}s`}}/>)}
          </div>
          {notice && <div role="status" aria-live="polite" className={`fade mb-4 flex items-start justify-between gap-3 rounded-2xl bd p-4 font-semibold ${nCls[notice.type]}`} data-testid="notice"><span>{notice.msg}</span><button className="shrink-0 rounded-lg p-1" aria-label="Tutup pemberitahuan" onClick={()=>setNotice(null)}><Icon n="x" s={18}/></button></div>}
          <div ref={boxRef} className="bg-app bd min-h-[260px] overflow-y-auto rounded-2xl p-5 sm:p-6" style={{maxHeight:"58vh"}} role="log" aria-live="polite" aria-label="Hasil transkripsi" data-testid="transcript">
            {!text&&!interim ? <p className="t-mute" style={{fontSize:settings.font*0.7}}>Hasil percakapan akan muncul di sini. Klik <b>Mulai Mendengarkan</b> atau <b>Coba Demo</b>.</p>
              : <p className="transcript t-main font-medium" style={{fontSize:settings.font}}><span data-testid="final-text">{text}</span>{interim&&<span className="t-mute italic" data-testid="interim-text"> {interim}</span>}</p>}
          </div>
          <p className="mt-2 text-sm t-mute">Teks final ditampilkan jelas; teks sementara (sedang dikenali) berwarna lebih pudar dan miring.</p>
          <div className="mt-4 flex flex-wrap gap-3">
            <Btn v="outline" icon="copy" onClick={copyText} data-testid="btn-copy">Salin</Btn>
            <Btn v="outline" icon="down" onClick={downloadText} data-testid="btn-download">Unduh TXT</Btn>
            <Btn v="outline" icon="save" onClick={saveHistory} data-testid="btn-save">Simpan ke Riwayat</Btn>
            <Btn v="outline" icon="trash" onClick={clearText} data-testid="btn-clear">Hapus Teks</Btn>
          </div>
        </div>

        <div className="card p-5 sm:p-7" aria-labelledby="demo-h">
          <h2 id="demo-h" className="mb-1 text-2xl font-bold t-main">Mode Demonstrasi</h2>
          <p className="mb-4 t-mute">Simulasi percakapan yang muncul bertahap—berjalan tanpa mikrofon, cocok untuk presentasi.</p>
          <div className="flex flex-wrap gap-3">
            <Btn icon="play" onClick={startDemo} disabled={status==="demo"||status==="listening"} data-testid="btn-demo">Coba Demo</Btn>
            <Btn v="outline" icon="pause" onClick={pauseDemo} disabled={status!=="demo"} data-testid="btn-demo-pause">Jeda Demo</Btn>
            <Btn v="outline" icon="play" onClick={resumeDemo} disabled={status!=="demoPaused"} data-testid="btn-demo-resume">Lanjutkan Demo</Btn>
            <Btn v="outline" icon="reset" onClick={resetDemo} disabled={status!=="demo"&&status!=="demoPaused"&&!text} data-testid="btn-demo-reset">Reset</Btn>
          </div>
        </div>
      </div>

      <aside className="grid content-start gap-6" aria-label="Pengaturan dan riwayat">
        <div className="card p-5 sm:p-6">
          <h2 className="mb-4 text-2xl font-bold t-main">Pengaturan Tampilan</h2>
          <div className="grid gap-4">
            <div><p className="mb-2 font-semibold t-main">Ukuran tulisan: <span data-testid="font-size">{settings.font}</span> px</p>
              <div className="flex gap-3">
                <Btn v="outline" icon="minus" className="flex-1" onClick={()=>set("font",Math.max(16,settings.font-4))} disabled={settings.font<=16} aria-label="Perkecil ukuran tulisan" data-testid="btn-font-down">A−</Btn>
                <Btn v="outline" icon="plus" className="flex-1" onClick={()=>set("font",Math.min(72,settings.font+4))} disabled={settings.font>=72} aria-label="Perbesar ukuran tulisan" data-testid="btn-font-up">A+</Btn>
              </div></div>
            <div className="grid gap-3">
              <Btn v="outline" icon={settings.theme==="dark"?"sun":"moon"} onClick={()=>set("theme",settings.theme==="dark"?"light":"dark")} data-testid="btn-theme">{settings.theme==="dark"?"Mode Terang":"Mode Gelap"}</Btn>
              <Btn v={settings.contrast==="high"?"primary":"outline"} icon="contrast" aria-pressed={settings.contrast==="high"} onClick={()=>set("contrast",settings.contrast==="high"?"normal":"high")} data-testid="btn-contrast">Kontras Tinggi: {settings.contrast==="high"?"Aktif":"Mati"}</Btn>
            </div>
            <div><label htmlFor="speed" className="mb-2 block font-semibold t-main">Kecepatan tampilan teks (demo): <span data-testid="speed-label">{["","Sangat lambat","Lambat","Sedang","Cepat","Sangat cepat"][speed]}</span></label>
              <input id="speed" type="range" min="1" max="5" value={speed} onChange={e=>set("speed",+e.target.value)} className="w-full" style={{accentColor:"var(--btn)",height:"2rem"}}/></div>
          </div>
        </div>
        <div className="card p-5 sm:p-6">
          <div className="mb-3 flex items-center justify-between gap-2"><h2 className="text-2xl font-bold t-main">Riwayat</h2>
            {history.length>0&&<Btn v="outline" icon="trash" className="!min-h-0 !px-3 !py-2 !text-sm" onClick={delAll} data-testid="btn-history-clear">Hapus semua</Btn>}</div>
          {history.length===0 ? <p className="t-mute">Belum ada riwayat. Klik <b>Simpan ke Riwayat</b> setelah transkripsi.</p> :
            <ul className="grid gap-3" data-testid="history-list">{history.map(it=>(
              <li key={it.id} className="rounded-2xl bg-soft bd p-4"><p className="font-bold t-main">{it.title}</p><p className="mb-3 text-sm t-mute">{fmtDate(it.date)}</p>
                <div className="flex gap-2"><Btn v="outline" icon="open" className="!min-h-0 !flex-1 !px-3 !py-2 !text-sm" onClick={()=>openItem(it)} aria-label={`Buka riwayat ${it.title}`}>Buka</Btn>
                  <Btn v="outline" icon="trash" className="!min-h-0 !px-3 !py-2 !text-sm" onClick={()=>delItem(it.id)} aria-label={`Hapus riwayat ${it.title}`}>Hapus</Btn></div></li>))}</ul>}
        </div>
      </aside>
    </section>);
}

/* ---------- app ---------- */
function useRoute(){
  const parse=()=>{ const h=(location.hash||"#beranda").slice(1); const demo=h==="transkripsi-demo"; const p=demo?"transkripsi":h; return {page:["beranda","tentang","transkripsi","panduan"].includes(p)?p:"beranda",demo}; };
  const [r,setR]=useState(parse);
  useEffect(()=>{ const f=()=>{ setR(parse()); window.scrollTo(0,0); }; window.addEventListener("hashchange",f); return()=>window.removeEventListener("hashchange",f); },[]);
  return r;
}
function App(){
  const {page,demo}=useRoute();
  const [text,setText]=useState("");
  const [settings,setSettings]=useState(()=>({font:28,theme:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"),contrast:"normal",speed:3,...store.get("bt_settings",{})}));
  useEffect(()=>{ document.documentElement.dataset.theme=settings.theme; document.documentElement.dataset.contrast=settings.contrast; store.set("bt_settings",settings); },[settings]);
  const [demoKey,setDemoKey]=useState(0);
  useEffect(()=>{ if(demo) setDemoKey(k=>k+1); },[demo,page]);
  return (<>
    <Navbar page={page}/>
    <main id="utama" tabIndex="-1">
      {page==="beranda"&&<Home/>}
      {page==="tentang"&&<About/>}
      {page==="panduan"&&<Guide/>}
      {page==="transkripsi"&&<Transcribe text={text} setText={setText} settings={settings} setSettings={setSettings} autoDemo={demo?demoKey:0}/>}
    </main>
    <footer className="bg-surface bd mt-10 border-x-0 border-b-0 px-4 py-8 text-center sm:px-8">
      <p className="font-bold t-main">BicaraTeks – Komunikasi Tanpa Batas</p>
      <p className="mt-1 t-mute">Proyek inovasi sosial digital untuk komunikasi yang inklusif. Dibuat dengan semangat ta’awun.</p>
    </footer>
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
